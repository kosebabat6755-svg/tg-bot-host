name: gembot

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gembot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install --quiet python-telegram-bot==22.6 httpx==0.28.1 cryptography

      - name: Run GemBot (4h45m window)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ROUTER_API_KEY: ${{ secrets.ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ROUTER_URL: ${{ secrets.ROUTER_URL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          MODEL_NAME: "Chatgem"
          STATE_DIR: ${{ github.workspace }}
          RUN_MINUTES: "285"
          STATE_PUSH_INTERVAL: "5"
          GITHUB_TOKEN: ${{ github.token }}
        run: python gembot.py

# schedule re-registration touch
